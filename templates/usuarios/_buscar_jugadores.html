{% for j in jugadores %}
<div class="flex items-center justify-between py-3 border-b border-slate-100 last:border-0">
    <div>
        <span class="font-medium text-slate-900">{{ j.nombre }} {{ j.apellido }}</span>
        <span class="text-sm text-slate-500 ml-2">{{ j.usuario.email }}</span>
        <span class="ml-2 inline-flex items-center gap-1 text-sm text-slate-400">{% include 'partials/_icon.html' with icon='pin' cls='h-3.5 w-3.5' %}{{ j.zona }}</span>
    </div>
    <form method="post" action="{% url 'usuarios:perfil_agregar_contacto' %}" class="shrink-0">
        {% csrf_token %}
        <input type="hidden" name="amigo_id" value="{{ j.pk }}">
        <button type="submit" class="text-sm bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-md transition">
            Agregar
        </button>
    </form>
</div>
{% empty %}
<p class="text-slate-500 text-sm py-2">No se encontraron jugadores.</p>
{% endfor %}
