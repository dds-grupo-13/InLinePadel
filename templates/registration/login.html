{% extends 'base.html' %}

{% block title %}Iniciar sesión | InLine Padel{% endblock %}

{% block content %}
<div class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-12">
    <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-lg">
        <div class="mb-6 text-center">
            <p class="text-sm font-semibold uppercase tracking-[0.2em] text-emerald-600">InLine Padel</p>
            <h1 class="mt-2 text-3xl font-bold text-slate-900">Iniciar sesión</h1>
        </div>

        <div class="mb-4 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
            Modo demo: el login es decorativo para la presentación.
        </div>

        <form method="post" action="{% url 'login' %}" class="space-y-5">
            {% csrf_token %}

            {% if error %}
                <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
                    {{ error }}
                </div>
            {% endif %}

            <div>
                <label for="id_email" class="mb-2 block text-sm font-medium text-slate-700">Email</label>
                <input type="email" name="email" id="id_email" value="demo@inlinepadel.com"
                    class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" />
            </div>

            <div>
                <label for="id_password" class="mb-2 block text-sm font-medium text-slate-700">Contraseña</label>
                <input type="password" name="password" id="id_password" value="demo"
                    class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" />
            </div>

            <button type="submit" class="w-full rounded-lg bg-emerald-600 px-4 py-3 font-semibold text-white transition hover:bg-emerald-700">
                Entrar a la demo
            </button>
        </form>
    </div>
</div>
{% endblock %}
